<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Architecting Trustworthy AI Integration in MBSE</title>
    <meta
      name="description"
      content="Map of the doctoral research programme: what each repository is for and how they link."
    />
    <!-- Preview card. Absolute URLs: Slack, LinkedIn and Twitter all drop a
         relative og:image. The path carries the /research-programme/ prefix
         because this is a GitHub Pages project site, not a domain root. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://systems-researcher.github.io/research-programme/" />
    <meta property="og:title" content="Architecting Trustworthy AI Integration in MBSE" />
    <meta property="og:description" content="A doctoral research programme mapped: what each study asks, how they depend on each other, and what has entered the written record." />
    <meta property="og:image" content="https://systems-researcher.github.io/research-programme/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Loughborough University" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Architecting Trustworthy AI Integration in MBSE" />
    <meta name="twitter:description" content="A doctoral research programme mapped: what each study asks, how they depend on each other, and what has entered the written record." />
    <meta name="twitter:image" content="https://systems-researcher.github.io/research-programme/preview.png" />
    <!-- Structured data for academic crawlers and reference managers.
         Static, because the programme facts here change by hand. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ResearchProject",
      "name": "Architecting Trustworthy AI Integration in MBSE",
      "description": "Doctoral research at Loughborough University: what an engineering record must expose for an AI consumer to tell a grounded claim from an ungrounded one, whether exposing it changes what the AI actually says, and how a substrate refuses an inadmissible write.",
      "url": "https://systems-researcher.github.io/research-programme/",
      "author": { "@type": "Person", "name": "Jason D. Gower" },
      "affiliation": { "@type": "Organization", "name": "Loughborough University" }
    }
    </script>
    <script>
      // Paint the stored scheme before first render. Without this the page
      // flashes light before React mounts and applies the class.
      (function () {
        try {
          var saved = localStorage.getItem("rp-theme")
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", dark)
          document.documentElement.style.colorScheme = dark ? "dark" : "light"
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
