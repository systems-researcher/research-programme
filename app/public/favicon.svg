<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Research programme map">
  <style>
    rect.bg { fill: #0a0a0a }
    .node { fill: #fafafa }
    .edge { stroke: #a1a1aa; stroke-width: 3; fill: none }
    @media (prefers-color-scheme: light) {
      rect.bg { fill: #fafafa }
      .node { fill: #0a0a0a }
