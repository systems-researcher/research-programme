  <path class="edge" d="M20 44h13a6 6 0 0 0 6-6v-3"/>
  <circle class="node" cx="16" cy="20" r="6"/>
  <circle class="node" cx="16" cy="44" r="6"/>
  <circle class="node" cx="44" cy="32" r="7"/>
</svg>
