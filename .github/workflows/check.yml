name: check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

  # The weekly refresh bot pushes with GITHUB_TOKEN, which starts no
  # workflows. Without this listener its commit would never be checked, and
  # pages.yml, which deploys only what check passed, would never publish it.
  # A workflow_run run checks out main's tip, which is the bot's commit. No job in this file carries an if, so every run's
  # conclusion is a verdict on the commit it checked out. "refresh" is
  # refresh.yml's name field.
  workflow_run:
    workflows: [refresh]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  data:
    name: repos.yml and the payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # The ten validation rules, before anything is generated from the file.
      - name: Validate repos.yml
        run: python -m scripts.build --check

      - name: Tests
        run: python -m pytest -q

      # Not collected by pytest (it is check_*, not test_*), so it needs
      # naming here or it silently stops running again.
      - name: Validator bites on malformed entries
        run: python tests/mutate_check.py

      # repos.yml is the source of truth but data/map.json is what ships.
      # Rebuilding and diffing is the only thing that catches a repos.yml edit
      # committed without its regenerated payload — the page would quietly
      # serve stale content with every other check green.
      - name: data/map.json and the README table are current
        run: |
          python -m scripts.build
          if ! git diff --quiet -- data/map.json README.md; then
            echo "::error::data/map.json or the README table is stale."
            echo "Run 'python -m scripts.build' and commit the result."
            git diff --stat -- data/map.json README.md
            exit 1
          fi
          echo "generated files match repos.yml"

  site:
    name: the page builds
    runs-on: ubuntu-latest
    # The production configuration, the same BASE_PATH pages.yml deploys
    # with. Set on the job rather than the build step because vite preview
    # re-reads vite.config.ts, so the served base comes from this
    # environment too.
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci, not npm install: it installs the locked tree and fails on a
      # lockfile that has drifted from package.json, which is what the
      # deployment build would hit.
      - run: npm ci
        working-directory: app

      - name: Lint
        run: npm run lint
        working-directory: app

      # tsc -b runs first inside this script, so a type error fails here.
      - run: npm run build
        working-directory: app

      # og/twitter tags are static in index.html and only the build output is
      # published, so the built file is the thing to assert against.
      - name: Social tags survive the build
        run: npm run test:meta
        working-directory: app

      # npm ci installs the playwright package, not the browser binary.
      # --with-deps is the flag Playwright documents for CI runners: it
      # apt-installs the OS libraries chromium needs. The local dry-run in
      # the acceptance criteria cannot exercise those libraries, so this
      # step carries the Linux side.
      - name: Install the chromium binary
        run: npx playwright install --with-deps chromium
        working-directory: app

      # Probe the prefixed URL. Under a base path, vite preview answers /
      # with a redirect, which curl -f accepts, so a root probe would pass
      # without serving the page.
      - name: Serve the built site
        run: |
          npm run preview -- --strictPort &
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:4173${BASE_PATH}" > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::vite preview never answered on :4173${BASE_PATH}"
          exit 1
        working-directory: app

      - name: Nothing scrolls sideways (layout)
        run: node tests/layout.spec.mjs "http://localhost:4173${BASE_PATH}"
        working-directory: app

      - name: Hash deep links open and close the sheet
        run: node tests/deep-link.spec.mjs "http://localhost:4173${BASE_PATH}"
        working-directory: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Fonts are bundled and Mermaid is an npm dependency precisely so the
      # page contacts nothing but github.com. This is what keeps that true.
      - name: The built page fetches nothing off-origin
        run: python tests/check_external_links.py

      # The banner and the preview card are drawn from data/map.json and
      # committed as PNGs. Nothing regenerates them on a data change, so
      # without this they would go on advertising last month's study counts.
      #
      # The check compares the VALUES the images draw, not their pixels. A
      # rendered PNG is not reproducible across platforms — Windows and Linux
      # rasterise the same text to different bytes — so a byte comparison
      # reports drift that is not there. This one needs no browser.
      #
      # It catches data drift, not layout drift: editing a generator's CSS
      # without regenerating will not fail here.
      - name: The generated images match the data
        run: |
          node scripts/image-data.mjs --check
        working-directory: app
