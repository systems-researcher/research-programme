name: pages

on:
  # Deploy only what check has passed. check runs on every push to main, and
  # on the refresh bot's commit through its own workflow_run listener
  # (GITHUB_TOKEN pushes start no workflows), so every main commit reaches
  # this file through one gate. To redeploy by hand, run check on main:
  #   gh workflow run check.yml --ref main
  # "check" is that workflow's name field. Renaming it stops deploys without
  # an error anywhere.
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

# Least privilege: read the repo, write the Pages artifact, and mint the
# token the deploy step exchanges. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run supersedes a waiting one, but never
# cancels a deployment already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Deploy only when all three hold.
    # 1. check passed. Any other conclusion means no deploy.
    # 2. check ran for a push, a manual dispatch, or the refresh chain,
    #    never for a pull request. A fork PR from a branch named main also
    #    reports head_branch main.
    # 3. The commit is still main's tip. On a workflow_run run, github.sha
    #    is the default branch's last commit, so an older check that
    #    finishes after a newer push is skipped instead of rolling the
    #    site back.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["push", "workflow_dispatch", "workflow_run"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    steps:
      # Build exactly the commit check passed. The job's if makes it main's
      # tip and never pull-request code, which matters because this
      # workflow holds pages: write and id-token: write.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      # A project Pages site is served from /<repo>/, not the domain root.
      # Vite writes absolute asset URLs, so without this every asset 404s.
      - name: Build
        run: npm run build
        working-directory: app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # The page is a single client-rendered document. Without this, a deep
      # link that Pages cannot resolve returns its own 404 rather than the app.
      - name: Serve unknown paths through the app
        run: cp site/index.html site/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
